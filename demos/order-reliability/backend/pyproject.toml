[project]
name = "order-reliability-lab"
version = "0.1.0"
description = "Clean-room distributed-state simulation; synthetic data only"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1", "ruff>=0.11,<1"]

[tool.setuptools.package-data]
app = ["infrastructure/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/app/api/*.py" = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app", "conftest"]
