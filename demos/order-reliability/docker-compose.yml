services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      LAB_DATA_DIR: /data
    volumes:
      - lab-state:/data
    expose:
      - '8000'
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 15
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - '127.0.0.1:5173:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  lab-state:
