<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="Identifiers are contracts, not just fields"><rect width="1080" height="640" fill="#0b1220"/><style>text{font-family:Arial,sans-serif}.title{font-size:29px;font-weight:bold;fill:#f1f5f9}.sub{font-size:15px;fill:#a8b8ce}.head{font-size:19px;font-weight:bold;fill:#f1f5f9}.body{font-size:15px;fill:#cbd5e1}.badge{font-size:11px;font-weight:bold;letter-spacing:1px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#647c9b"/></marker></defs><text font-family="Arial, sans-serif" x="36" y="50" class="title" fill="#f1f5f9" font-size="29" font-weight="bold">Identifiers are contracts, not just fields</text><text font-family="Arial, sans-serif" x="36" y="81" class="sub" fill="#a8b8ce" font-size="15">An HTTP 204 response can still carry the wrong session semantics.</text><path d="M36 111 H1044" stroke="#24344a"/><path d="M336 238.5 L382 238.5" fill="none" stroke="#647c9b" stroke-width="2"  marker-end="url(#a)"/><path d="M690 238.5 L736 238.5" fill="none" stroke="#647c9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M336 447.5 L382 447.5" fill="none" stroke="#647c9b" stroke-width="2"  marker-end="url(#a)"/><path d="M690 447.5 L736 447.5" fill="none" stroke="#647c9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="36" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="36" y="156" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="56" y="184" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">REPORTED + OBSERVED</text><text font-family="Arial, sans-serif" x="56" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Landing browser</text><text font-family="Arial, sans-serif" x="56" y="244" class="body" fill="#cbd5e1" font-size="15">client/session identifiers</text><text font-family="Arial, sans-serif" x="56" y="267" class="body" fill="#cbd5e1" font-size="15">UTM + first/last-touch context</text><rect x="390" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="390" y="156" width="4" height="165" rx="2" fill="#5eead4"/><text font-family="Arial, sans-serif" x="410" y="184" class="badge" font-size="11" font-weight="bold" fill="#5eead4">RUNTIME OBSERVATION</text><text font-family="Arial, sans-serif" x="410" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Decorated navigation</text><text font-family="Arial, sans-serif" x="410" y="244" class="body" fill="#cbd5e1" font-size="15">Linker + attribution parameters</text><text font-family="Arial, sans-serif" x="410" y="267" class="body" fill="#cbd5e1" font-size="15">Observed on destination link</text><rect x="744" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="744" y="156" width="4" height="165" rx="2" fill="#fbbf24"/><text font-family="Arial, sans-serif" x="764" y="184" class="badge" font-size="11" font-weight="bold" fill="#fbbf24">UNKNOWN</text><text font-family="Arial, sans-serif" x="764" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Product continuity</text><text font-family="Arial, sans-serif" x="764" y="244" class="body" fill="#cbd5e1" font-size="15">Same cid / sid after navigation?</text><text font-family="Arial, sans-serif" x="764" y="267" class="body" fill="#cbd5e1" font-size="15">No retained before/after pair</text><rect x="36" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="36" y="365" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="56" y="393" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">RUNTIME + CONTRACT</text><text font-family="Arial, sans-serif" x="56" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Backend input</text><text font-family="Arial, sans-serif" x="56" y="453" class="body" fill="#cbd5e1" font-size="15">client_id + session_id</text><text font-family="Arial, sans-serif" x="56" y="476" class="body" fill="#cbd5e1" font-size="15">event_id + user identity contract</text><rect x="390" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="390" y="365" width="4" height="165" rx="2" fill="#5eead4"/><text font-family="Arial, sans-serif" x="410" y="393" class="badge" font-size="11" font-weight="bold" fill="#5eead4">RUNTIME OBSERVATION</text><text font-family="Arial, sans-serif" x="410" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">GA4 outgoing request</text><text font-family="Arial, sans-serif" x="410" y="453" class="body" fill="#cbd5e1" font-size="15">cid correct; ep.session_id set</text><text font-family="Arial, sans-serif" x="410" y="476" class="body" fill="#cbd5e1" font-size="15">Standard sid missing; HTTP 204</text><rect x="744" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="744" y="365" width="4" height="165" rx="2" fill="#fbbf24"/><text font-family="Arial, sans-serif" x="764" y="393" class="badge" font-size="11" font-weight="bold" fill="#fbbf24">UNKNOWN</text><text font-family="Arial, sans-serif" x="764" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Scoped transformation</text><text font-family="Arial, sans-serif" x="764" y="453" class="body" fill="#cbd5e1" font-size="15">Add ga_session_id; exclude raw</text><text font-family="Arial, sans-serif" x="764" y="476" class="body" fill="#cbd5e1" font-size="15">After-fix outgoing sid unproven</text><text font-family="Arial, sans-serif" x="36" y="580" class="sub" fill="#a8b8ce" font-size="15">event_id is not a GA4 session ID. URL decoration does not establish session stitching or measured dedup.</text><text font-family="Arial, sans-serif" x="36" y="612" class="badge" font-size="11" font-weight="bold" fill="#627892">COINASK / RECONSTRUCTED EVIDENCE VIEW / NO CUSTOMER IDENTIFIERS</text></svg>