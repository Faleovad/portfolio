<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="Multi-destination analytics architecture"><rect width="1080" height="640" fill="#0b1220"/><style>text{font-family:Arial,sans-serif}.title{font-size:29px;font-weight:bold;fill:#f1f5f9}.sub{font-size:15px;fill:#a8b8ce}.head{font-size:19px;font-weight:bold;fill:#f1f5f9}.body{font-size:15px;fill:#cbd5e1}.badge{font-size:11px;font-weight:bold;letter-spacing:1px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#647c9b"/></marker></defs><text font-family="Arial, sans-serif" x="36" y="50" class="title" fill="#f1f5f9" font-size="29" font-weight="bold">Multi-destination analytics architecture</text><text font-family="Arial, sans-serif" x="36" y="81" class="sub" fill="#a8b8ce" font-size="15">Two ingress paths, direct browser integrations, and explicit evidence boundaries.</text><path d="M36 111 H1044" stroke="#24344a"/><path d="M336 238.5 L382 238.5" fill="none" stroke="#647c9b" stroke-width="2"  marker-end="url(#a)"/><path d="M690 238.5 L736 238.5" fill="none" stroke="#647c9b" stroke-width="2"  marker-end="url(#a)"/><path d="M540 365 L540 329" fill="none" stroke="#647c9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M690 447.5 L736 447.5" fill="none" stroke="#647c9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M186 365 L186 329" fill="none" stroke="#647c9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="36" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="36" y="156" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="56" y="184" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">REPORTED CONFIGURATION</text><text font-family="Arial, sans-serif" x="56" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Websites + product app</text><text font-family="Arial, sans-serif" x="56" y="244" class="body" fill="#cbd5e1" font-size="15">Marketing → product boundary</text><text font-family="Arial, sans-serif" x="56" y="267" class="body" fill="#cbd5e1" font-size="15">Web GTM browser collection</text><rect x="390" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="390" y="156" width="4" height="165" rx="2" fill="#5eead4"/><text font-family="Arial, sans-serif" x="410" y="184" class="badge" font-size="11" font-weight="bold" fill="#5eead4">RUNTIME OBSERVATION</text><text font-family="Arial, sans-serif" x="410" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">First-party collection</text><text font-family="Arial, sans-serif" x="410" y="244" class="body" fill="#cbd5e1" font-size="15">GA4 browser → Server GTM</text><text font-family="Arial, sans-serif" x="410" y="267" class="body" fill="#cbd5e1" font-size="15">CTA debug request retained</text><rect x="744" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="744" y="156" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="764" y="184" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">REPORTED + OBSERVED</text><text font-family="Arial, sans-serif" x="764" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">GA4 + Mixpanel</text><text font-family="Arial, sans-serif" x="764" y="244" class="body" fill="#cbd5e1" font-size="15">Backend delivery reported</text><text font-family="Arial, sans-serif" x="764" y="267" class="body" fill="#cbd5e1" font-size="15">GA4 request details retained</text><rect x="36" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="36" y="365" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="56" y="393" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">REPORTED CONFIGURATION</text><text font-family="Arial, sans-serif" x="56" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">CMP / consent bridge</text><text font-family="Arial, sans-serif" x="56" y="453" class="body" fill="#cbd5e1" font-size="15">Default denied in configuration</text><text font-family="Arial, sans-serif" x="56" y="476" class="body" fill="#cbd5e1" font-size="15">Consent gates browser tags</text><rect x="390" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="390" y="365" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="410" y="393" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">REPORTED CONFIGURATION</text><text font-family="Arial, sans-serif" x="410" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Backend ingress</text><text font-family="Arial, sans-serif" x="410" y="453" class="body" fill="#cbd5e1" font-size="15">Authenticated event receiver</text><text font-family="Arial, sans-serif" x="410" y="476" class="body" fill="#cbd5e1" font-size="15">Identity + attribution payload</text><rect x="744" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="744" y="365" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="764" y="393" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">HISTORICAL CONFIGURATION</text><text font-family="Arial, sans-serif" x="764" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Other destination paths</text><text font-family="Arial, sans-serif" x="764" y="453" class="body" fill="#cbd5e1" font-size="15">Meta CAPI + PostHog: audit</text><text font-family="Arial, sans-serif" x="764" y="476" class="body" fill="#cbd5e1" font-size="15">Browser: Meta / MP / Clarity / PH</text><text font-family="Arial, sans-serif" x="36" y="580" class="sub" fill="#a8b8ce" font-size="15">Solid edge: observed browser transport. Dashed edges: reported configuration; full consent QA remains UNKNOWN.</text><text font-family="Arial, sans-serif" x="36" y="612" class="badge" font-size="11" font-weight="bold" fill="#627892">COINASK / RECONSTRUCTED EVIDENCE VIEW / NO CUSTOMER IDENTIFIERS</text></svg>