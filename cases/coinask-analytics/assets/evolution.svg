l, sans-serif" x="56" y="453" class="body" fill="#cbd5e1" font-size="15">Duplicate-tag / version audits</text><text font-family="Arial, sans-serif" x="56" y="476" class="body" fill="#cbd5e1" font-size="15">Stale workspace release risk</text><rect x="390" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="390" y="365" width="4" height="165" rx="2" fill="#5eead4"/><text font-family="Arial, sans-serif" x="410" y="393" class="badge" font-size="11" font-weight="bold" fill="#5eead4">RUNTIME OBSERVATION</text><text font-family="Arial, sans-serif" x="410" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">August 3</text><text font-family="Arial, sans-serif" x="410" y="453" class="body" fill="#cbd5e1" font-size="15">Correct cid; missing standard sid</text><text font-family="Arial, sans-serif" x="410" y="476" class="body" fill="#cbd5e1" font-size="15">HTTP success ≠ semantic success</text><rect x="744" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="744" y="365" width="4" height="165" rx="2" fill="#fbbf24"/><text font-family="Arial, sans-serif" x="764" y="393" class="badge" font-size="11" font-weight="bold" fill="#fbbf24">UNKNOWN</text><text font-family="Arial, sans-serif" x="764" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">August 18</text><text font-family="Arial, sans-serif" x="764" y="453" class="body" fill="#cbd5e1" font-size="15">Later routing + PostHog audit</text><text font-family="Arial, sans-serif" x="764" y="476" class="body" fill="#cbd5e1" font-size="15">Continuity / final launch gates</text><text font-family="Arial, sans-serif" x="36" y="580" class="sub" fill="#a8b8ce" font-size="15">Later configuration is not a final acceptance receipt. Revenue uplift, launch readiness and stitching stay UNKNOWN.</text><text font-family="Arial, sans-serif" x="36" y="612" class="badge" font-size="11" font-weight="bold" fill="#627892">COINASK / RECONSTRUCTED EVIDENCE VIEW