<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" role="img" aria-label="Browser and backend event paths"><rect width="1080" height="640" fill="#0b1220"/><style>text{font-family:Arial,sans-serif}.title{font-size:29px;font-weight:bold;fill:#f1f5f9}.sub{font-size:15px;fill:#a8b8ce}.head{font-size:19px;font-weight:bold;fill:#f1f5f9}.body{font-size:15px;fill:#cbd5e1}.badge{font-size:11px;font-weight:bold;letter-spacing:1px}</style><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#647c9b"/></marker></defs><text font-family="Arial, sans-serif" x="36" y="50" class="title" fill="#f1f5f9" font-size="29" font-weight="bold">Browser and backend event paths</text><text font-family="Arial, sans-serif" x="36" y="81" class="sub" fill="#a8b8ce" font-size="15">The later implementation includes direct browser destinations alongside server collection.</text><path d="M36 111 H1044" stroke="#24344a"/><path d="M336 238.5 L382 238.5" fill="none" stroke="#647c9b" stroke-width="2"  marker-end="url(#a)"/><path d="M336 447.5 L382 447.5" fill="none" stroke="#647c9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><path d="M690 447.5 L736 447.5" fill="none" stroke="#647c9b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a)"/><rect x="36" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="36" y="156" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="56" y="184" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">IMPLEMENTED LOCALLY</text><text font-family="Arial, sans-serif" x="56" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Browser CTA</text><text font-family="Arial, sans-serif" x="56" y="244" class="body" fill="#cbd5e1" font-size="15">Click listener → dataLayer</text><text font-family="Arial, sans-serif" x="56" y="267" class="body" fill="#cbd5e1" font-size="15">event_id + text + destination</text><rect x="390" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="390" y="156" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="410" y="184" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">IMPLEMENTED + VERIFIED</text><text font-family="Arial, sans-serif" x="410" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Web GA4 tag</text><text font-family="Arial, sans-serif" x="410" y="244" class="body" fill="#cbd5e1" font-size="15">CTA parameters + consent settings</text><text font-family="Arial, sans-serif" x="410" y="267" class="body" fill="#cbd5e1" font-size="15">Preview collection observed</text><rect x="744" y="156" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="744" y="156" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="764" y="184" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">REPORTED CONFIGURATION</text><text font-family="Arial, sans-serif" x="764" y="215" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Direct browser tags</text><text font-family="Arial, sans-serif" x="764" y="244" class="body" fill="#cbd5e1" font-size="15">Mixpanel / Meta / Clarity</text><text font-family="Arial, sans-serif" x="764" y="267" class="body" fill="#cbd5e1" font-size="15">PostHog Base in later audit</text><rect x="36" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="36" y="365" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="56" y="393" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">CONVERSATION / SPEC</text><text font-family="Arial, sans-serif" x="56" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Backend core events</text><text font-family="Arial, sans-serif" x="56" y="453" class="body" fill="#cbd5e1" font-size="15">Signup / activation / first query</text><text font-family="Arial, sans-serif" x="56" y="476" class="body" fill="#cbd5e1" font-size="15">Subscription event contract</text><rect x="390" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="390" y="365" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="410" y="393" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">REPORTED CONFIGURATION</text><text font-family="Arial, sans-serif" x="410" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Server tag routing</text><text font-family="Arial, sans-serif" x="410" y="453" class="body" fill="#cbd5e1" font-size="15">GA4 + Mixpanel</text><text font-family="Arial, sans-serif" x="410" y="476" class="body" fill="#cbd5e1" font-size="15">Meta + PostHog in later audit</text><rect x="744" y="365" width="300" height="165" rx="12" fill="#142136" stroke="#2c405c"/><rect x="744" y="365" width="4" height="165" rx="2" fill="#93c5fd"/><text font-family="Arial, sans-serif" x="764" y="393" class="badge" font-size="11" font-weight="bold" fill="#93c5fd">LIVE CHECKS REPORTED</text><text font-family="Arial, sans-serif" x="764" y="424" class="head" fill="#f1f5f9" font-size="19" font-weight="bold">Lifecycle payload checks</text><text font-family="Arial, sans-serif" x="764" y="453" class="body" fill="#cbd5e1" font-size="15">Renewed / refunded / failed</text><text font-family="Arial, sans-serif" x="764" y="476" class="body" fill="#cbd5e1" font-size="15">Canonical names; per-event fields</text><text font-family="Arial, sans-serif" x="36" y="580" class="sub" fill="#a8b8ce" font-size="15">Signup/activation Mixpanel events were confirmed backend-only; the proposed dual-path dedup fix was withdrawn.</text><text font-family="Arial, sans-serif" x="36" y="612" class="badge" font-size="11" font-weight="bold" fill="#627892">COINASK / RECONSTRUCTED EVIDENCE VIEW / NO CUSTOMER IDENTIFIERS</text></svg>