<rect x="50" y="454" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="62" y="475">Order identity / status / tracking</text>
<rect x="50" y="516" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="62" y="537">Offers / product catalog</text>
<rect x="50" y="578" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="62" y="599">Warehouse / reserve / fulfilled stock</text>
<rect x="660" y="555" width="510" height="360" rx="14" fill="#fff" stroke="#b5ccbd"/>
<text class="title" x="684" y="592">Yellow Client</text><text class="sub" x="684" y="616">Separate local application — reviewed source</text>
<rect x="680" y="639" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="692" y="660">Catalog refresh / local reference</text>
<rect x="680" y="701" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="692" y="722">XLSX / OOXML workbook processing</text>
<rect x="680" y="763" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="692" y="784">Staging / validation / hashes / CURRENT_RUN</text>
