<text class="row" x="692" y="321">Recovery and reconciliation</text>
<rect x="680" y="362" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="692" y="383">Catalog Snapshot Worker</text>
<rect x="680" y="424" width="470" height="50" rx="6" fill="#eaf2ec"/>
<text class="row" x="692" y="445">Replenishment / notification outbox</text>
