<text x="50" y="756" class="sub">Authority boundaries:</text><text x="50" y="786" class="row">Accepted request ≠ confirmed business effect</text><text x="50" y="818" class="row">Task ownership ≠ mutation permission</text><text x="50" y="850" class="row">Local proposal/cache ≠ remote commit</text>
