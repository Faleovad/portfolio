<text class="row" x="692" y="846">Bundle / threshold proposals and pending intent</text>
<text class="tag" x="684" y="897">Installed version UNKNOWN; guarded APPLY / reconciliation</text>
<path d="M540 145 H660" fill="none" stroke="#397367" stroke-width="2" marker-end="url(#arrow)"/><text class="edge" x="552" y="126">source reads</text>
<path d="M660 350 C590 350 600 440 540 440" fill="none" stroke="#397367" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text class="edge" x="554" y="370">guarded writes</text><text class="edge" x="554" y="388">exact readback</text>
