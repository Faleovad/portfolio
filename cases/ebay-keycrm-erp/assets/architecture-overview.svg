<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
<title id="title">eBay, Cloudflare Runtime, KeyCRM and Yellow Client</title>
<desc id="desc">Commercial architecture boundary view. Retained source and state snapshot, not runtime telemetry. Yellow installed identity unknown.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#397367"/></marker></defs>
<rect width="1200" height="920" fill="#f1f5f2"/>
<style>text{font-family:Arial,sans-serif;fill:#193e34}.title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#59796c}.row{font-size:16px}.edge{font-size:13px;fill:#306a5e}.tag{font-size:12px;fill:#88602c}</style>
<rect x="30" y="30" width="510" height="215" rx="14" fill="#fff" stroke="#b5ccbd"/>
